<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sheela's Wheel of Doom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: marquee-lit wheel on the left, names + tally panel on the right; stacks on phones. */
:root {
  --bg: #eceff8;
  --surface: #ffffff;
  --surface-2: #f2f4fb;
  --ink: #12163a;
  --muted: #566086;
  --line: #d8dcee;
  --rim: #1b2160;
  --rim-edge: #0e1240;
  --bulb-on: #ffd23f;
  --bulb-off: #6b72b8;
  --accent: #ffd23f;
  --accent-ink: #12163a;
  --pin: #ff3d71;
  --focus: #3b46e0;
  --danger: #c8203f;
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0e2b; --surface: #151a47; --surface-2: #1d2257; --ink: #eef0ff; --muted: #a3a9d6;
    --line: #2c3278; --rim: #2a3190; --rim-edge: #070920; --bulb-off: #4a529e;
    --pin: #ff5a86; --focus: #8c96ff; --danger: #ff7b93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0e2b; --surface: #151a47; --surface-2: #1d2257; --ink: #eef0ff; --muted: #a3a9d6;
  --line: #2c3278; --rim: #2a3190; --rim-edge: #070920; --bulb-off: #4a529e;
  --pin: #ff5a86; --focus: #8c96ff; --danger: #ff7b93; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.45;
  padding-block: 22px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.app {
  max-width: 1180px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 400px);
  gap: 24px 40px;
  align-items: start;
}
.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.top-text { display: grid; gap: 6px; flex: 1 1 320px; min-width: 0; }

/* Teacher */
.teacher { margin: 0; position: relative; width: 150px; flex: none; margin-top: 44px; }
.teacher svg { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 6px 10px rgba(8, 10, 40, 0.3)); transform-origin: 50% 100%; }
.bubble {
  position: absolute; z-index: 2; right: 100%; bottom: 70%; margin: 0 -8px 0 0;
  width: max-content; max-width: min(250px, 60vw); padding: 8px 12px; border-radius: 14px 14px 4px 14px;
  background: var(--surface); border: 2px solid var(--ink); font-weight: 700; font-size: 0.88rem; line-height: 1.25;
  animation: bubble-in 0.3s ease-out both;
}
.bubble.swap { animation: bubble-in 0.3s ease-out both; }
@keyframes bubble-in { from { opacity: 0; translate: 6px 6px; scale: 0.9; } to { opacity: 1; translate: 0 0; scale: 1; } }
.teacher .mouth-open { opacity: 0; }
.teacher .brows, .teacher .eyes, .teacher .stick { transition: transform 0.25s ease; }
.teacher .brows { animation: brow-twitch 5s ease-in-out infinite; transform-box: fill-box; }
@keyframes brow-twitch { 0%, 88%, 100% { transform: translateY(0); } 92% { transform: translateY(-3px); } 96% { transform: translateY(1px); } }
.teacher .stick { transform-origin: 188px 226px; animation: tap 2.4s ease-in-out infinite; }
@keyframes tap { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-3deg); } }
.teacher[data-mood="spinning"] svg { animation: lean 0.5s ease-in-out infinite alternate; }
.teacher[data-mood="spinning"] .eyes { transform: translateX(-3px); }
.teacher[data-mood="spinning"] .brows { animation: none; transform: translateY(3px); }
@keyframes lean { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }
.teacher[data-mood="win"] .mouth-open { opacity: 1; }
.teacher[data-mood="win"] .mouth-frown { opacity: 0; }
.teacher[data-mood="win"] svg { animation: shout 0.5s ease-out; }
.teacher[data-mood="win"] .stick { animation: point 0.5s ease-out forwards; }
@keyframes shout { 30% { transform: scale(1.1); } }
@keyframes point { to { transform: rotate(-14deg); } }
@media (max-width: 560px) {
  .teacher { width: 120px; margin-top: 52px; margin-left: auto; }
  .bubble { bottom: 78%; max-width: 52vw; font-size: 0.8rem; }
}
h1 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 800;
  font-size: clamp(2.1rem, 5.5vw, 3.4rem);
  letter-spacing: -0.025em;
  line-height: 1;
  text-wrap: balance;
}
.top p { margin: 0; color: var(--muted); max-width: 62ch; }

/* ---------- Wheel ---------- */
.stage-col { display: grid; justify-items: center; min-width: 0; }
.stage {
  --chase: 1.2s;
  position: relative;
  width: min(100%, 640px, max(300px, calc(100svh - 170px)));
  aspect-ratio: 1 / 1;
  container-type: inline-size;
  animation: stage-in 0.7s cubic-bezier(.2, .9, .3, 1.2) both;
}
.stage.spinning { --chase: 0.2s; }
@keyframes stage-in { from { transform: scale(0.92); } to { transform: scale(1); } }

.rim {
  position: absolute; inset: 0; border-radius: 50%;
  background: var(--rim);
  box-shadow: 0 1.6cqw 4cqw rgba(8, 10, 40, 0.38), inset 0 0 0 0.7cqw var(--rim-edge);
}
.bulb {
  position: absolute; left: 50%; top: 50%;
  width: 2.4cqw; height: 2.4cqw; margin: -1.2cqw 0 0 -1.2cqw;
  border-radius: 50%;
  background: var(--bulb-off);
  transform: rotate(var(--a)) translateY(-47cqw);
  animation: blink var(--chase) steps(1, end) infinite;
}
.bulb:nth-child(even) { animation-delay: calc(var(--chase) / -2); }
@keyframes blink {
  0% { background: var(--bulb-on); box-shadow: 0 0 1.4cqw 0.3cqw var(--bulb-on); }
  50% { background: var(--bulb-off); box-shadow: none; }
}

#wheel {
  position: absolute; inset: 6%; width: 88%; height: 88%;
  display: block; border-radius: 50%; cursor: pointer;
  box-shadow: 0 0 0 0.5cqw var(--rim-edge);
}
#wheel.bump { animation: bump 0.35s ease-out; }
@keyframes bump { 40% { scale: 1.025; } }

.pin-wrap {
  position: absolute; z-index: 3; left: 50%; top: -1.6cqw;
  width: 8cqw; height: 11.5cqw; margin-left: -4cqw;
  filter: drop-shadow(0 0.6cqw 0.7cqw rgba(0, 0, 0, 0.45));
  pointer-events: none;
}
.pin {
  position: relative; width: 100%; height: 100%;
  background: var(--pin);
  clip-path: polygon(50% 100%, 4% 38%, 20% 6%, 80% 6%, 96% 38%);
  transform-origin: 50% 18%;
}
.pin::after {
  content: ""; position: absolute; left: 34%; top: 17%; width: 32%; aspect-ratio: 1;
  border-radius: 50%; background: rgba(255, 255, 255, 0.9);
}

.hub {
  position: absolute; z-index: 2; left: 50%; top: 50%; translate: -50% -50%;
  width: 20cqw; height: 20cqw; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink);
  border: 1.1cqw solid var(--rim); outline-offset: 0.6cqw;
  font-family: var(--f-display); font-weight: 800;
  font-size: max(13px, 4.6cqw); letter-spacing: 0.04em; text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 0.8cqw 1.6cqw rgba(8, 10, 40, 0.4);
  transition: scale 0.15s ease, opacity 0.2s;
}
.hub::before {
  content: ""; position: absolute; inset: -1.4cqw; border-radius: 50%;
  border: 0.6cqw solid var(--accent); opacity: 0;
  animation: ring 2.2s ease-out infinite;
}
@keyframes ring { 0% { scale: 0.85; opacity: 0.9; } 100% { scale: 1.3; opacity: 0; } }
.hub:hover:not(:disabled) { scale: 1.07; }
.hub:active:not(:disabled) { scale: 0.95; }
.hub:disabled { cursor: default; opacity: 0.85; }
.stage.spinning .hub::before, .hub:disabled::before { animation: none; opacity: 0; }

.status { margin: 14px 0 0; color: var(--muted); font-weight: 500; text-align: center; min-height: 1.45em; }

/* ---------- Panel ---------- */
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  padding: 18px; display: grid; gap: 14px; min-width: 0;
  transition: opacity 0.25s;
}
.panel.locked { opacity: 0.6; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; letter-spacing: -0.01em; }
.count { display: inline-block; margin-left: 6px; padding: 1px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: 0.9rem; font-weight: 700; font-variant-numeric: tabular-nums; vertical-align: 2px; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; }

.btn {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px;
  padding: 7px 13px; font-weight: 600; font-size: 0.875rem; cursor: pointer;
  transition: translate 0.12s, background 0.15s;
}
.btn:hover { translate: 0 -1px; }
.btn:active { translate: 0 1px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.small { padding: 4px 10px; font-size: 0.8rem; }

.add { display: flex; gap: 8px; }
.add input {
  flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface-2); font-size: 16px;
}
.add input::placeholder { color: var(--muted); }
.add .btn { font-size: 0.95rem; padding-inline: 18px; }

.list {
  list-style: none; margin: 0; padding: 0 4px 0 0;
  max-height: min(50vh, 440px); overflow-y: auto;
  display: flex; flex-direction: column; gap: 2px;
}
.row {
  display: grid; grid-template-columns: 14px minmax(0, 1fr) auto 32px; align-items: center; gap: 6px;
  max-height: 60px; border-radius: 10px;
}
.row.enter { animation: row-in 0.28s ease-out both; }
.row.leaving { animation: row-out 0.18s ease-in forwards; overflow: hidden; }
.row.won { animation: won 1.1s ease-in-out 2; }
@keyframes row-in { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
@keyframes row-out { to { opacity: 0; transform: translateX(14px); max-height: 0; } }
@keyframes won { 0%, 100% { background: transparent; } 30%, 70% { background: color-mix(in srgb, var(--c) 45%, transparent); } }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); justify-self: center; }
.row input {
  width: 100%; min-width: 0; padding: 8px 10px; border-radius: 8px;
  border: 1px solid transparent; background: transparent; font-weight: 500; font-size: 16px;
}
.row input:hover { background: var(--surface-2); }
.row input:focus { background: var(--surface-2); border-color: var(--line); }
.tally {
  min-width: 2.6em; padding: 2px 8px; border-radius: 999px; text-align: center;
  font-size: 0.8rem; font-weight: 700; font-variant-numeric: tabular-nums;
  background: var(--surface-2); color: var(--muted);
}
.tally.has { background: var(--c); color: var(--c-ink); }
.tally.lead { outline: 2px solid var(--ink); outline-offset: 1px; }
.tally.pop { animation: tally-pop 0.5s ease-out; }
@keyframes tally-pop { 40% { scale: 1.35; } }
.rm {
  width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: var(--muted);
  display: grid; place-items: center; cursor: pointer;
}
.rm:hover { background: var(--surface-2); color: var(--danger); }

.opts { border-top: 1px solid var(--line); padding-top: 6px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; font-weight: 500; cursor: pointer; }
.switch input {
  appearance: none; -webkit-appearance: none; flex: none; margin: 0; cursor: pointer;
  width: 40px; height: 24px; border-radius: 999px; background: var(--line); position: relative; transition: background 0.2s;
}
.switch input::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--surface); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35); transition: transform 0.2s;
}
.switch input:checked { background: var(--focus); }
.switch input:checked::after { transform: translateX(16px); }

.history-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.history-head h3 { margin: 0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.history-head .total { font-variant-numeric: tabular-nums; }
.board { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 10px; }
.board li { display: grid; grid-template-columns: 26px minmax(0, 1fr); column-gap: 8px; row-gap: 3px; align-items: center; }
.board .rank { grid-row: 1 / 3; text-align: right; font-weight: 800; font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.board li.first .rank { color: var(--ink); }
.board .who { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; min-width: 0; font-weight: 600; }
.board li.first .nm { font-weight: 800; }
.board .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board .num { flex: none; font-variant-numeric: tabular-nums; font-size: 0.85rem; font-weight: 700; color: var(--muted); }
.board .num b { color: var(--ink); font-size: 1rem; }
.track { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.fill { height: 100%; width: 0; border-radius: 999px; background: var(--c); transition: width 0.6s cubic-bezier(.2, .8, .2, 1); }
.board .empty { display: block; color: var(--muted); font-weight: 500; }
#unlanded { margin-top: 10px; }
.recent-head { margin-top: 14px; }
.history { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.history li { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; background: var(--surface-2); font-size: 0.85rem; font-weight: 600; }
.history .dot { width: 9px; height: 9px; }
.note { margin: 0; color: var(--muted); font-size: 0.8rem; }

/* ---------- Winner reveal ---------- */
.reveal {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.reveal-card {
  width: min(100%, 470px); text-align: center; padding: 28px 22px 22px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 24px;
  box-shadow: 0 30px 80px rgba(6, 8, 30, 0.4);
  animation: card-in 0.4s cubic-bezier(.2, .9, .3, 1.25) both;
}
@keyframes card-in { from { scale: 0.85; opacity: 0; } to { scale: 1; opacity: 1; } }
.kicker { margin: 0 0 14px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.reveal-name {
  display: inline-block; margin: 0; padding: 0.08em 0.4em 0.14em; max-width: 100%;
  background: var(--c); color: var(--c-ink); border-radius: 14px;
  font-family: var(--f-display); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1;
  font-size: clamp(2rem, 9vw, 3.6rem); overflow-wrap: anywhere;
  animation: name-pop 0.6s cubic-bezier(.2, .9, .3, 1.3) 0.1s both;
}
@keyframes name-pop {
  0% { scale: 0.5; rotate: -10deg; opacity: 0; }
  100% { scale: 1; rotate: -2deg; opacity: 1; }
}
.reveal-note { margin: 16px 0 0; color: var(--muted); font-weight: 500; min-height: 1.4em; }
.reveal-actions { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.reveal-actions .btn { font-size: 0.95rem; padding: 9px 16px; }

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

.toast {
  position: fixed; z-index: 70; left: 50%; translate: -50% 0;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 14px; max-width: calc(100% - 32px);
  padding: 10px 12px 10px 16px; border-radius: 12px;
  background: var(--ink); color: var(--bg); font-weight: 500; font-size: 0.9rem;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  animation: toast-in 0.25s ease-out both;
}
@keyframes toast-in { from { translate: -50% 12px; opacity: 0; } to { translate: -50% 0; opacity: 1; } }
.toast-btn { border: 0; border-radius: 8px; padding: 5px 12px; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .list { max-height: 360px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  .bulb { animation: none; }
  .bulb:nth-child(odd) { background: var(--bulb-on); }
}
</style>

</head>
<body>
<main class="app">
  <header class="top">
    <div class="top-text">
      <h1>Sheela's Wheel of Doom</h1>
      <p>Click the wheel, press SPIN, or hit Space. Edit, add or remove names on the right. Every landing is counted.</p>
    </div>
    <figure class="teacher" id="teacher" data-mood="idle">
      <p class="bubble" id="bubble" aria-live="polite">Sit up straight. Spin the wheel.</p>
      <svg viewBox="0 0 220 230" role="img" aria-label="Cartoon of a stern history teacher with glasses and a hair bun, standing in front of a chalkboard">
        <!-- chalkboard -->
        <rect x="6" y="6" width="208" height="150" rx="8" fill="#8a5a33"/>
        <rect x="14" y="14" width="192" height="134" rx="4" fill="#1f4d3a"/>
        <text x="110" y="46" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="22" fill="#f4f1e6" letter-spacing="2">POP QUIZ</text>
        <text x="28" y="76" font-family="Bricolage Grotesque, sans-serif" font-weight="600" font-size="13" fill="#d9e6d2">1066</text>
        <text x="28" y="96" font-family="Bricolage Grotesque, sans-serif" font-weight="600" font-size="13" fill="#d9e6d2">1492</text>
        <text x="28" y="116" font-family="Bricolage Grotesque, sans-serif" font-weight="600" font-size="13" fill="#d9e6d2">1776</text>
        <path d="M24 134 H60" stroke="#d9e6d2" stroke-width="2" stroke-linecap="round" opacity=".6"/>
        <path d="M178 92 l8 8 m0 -8 l-8 8" stroke="#ff8a8a" stroke-width="3" stroke-linecap="round"/>
        <rect x="14" y="148" width="192" height="8" fill="#8a5a33"/>
        <!-- pointer stick -->
        <g class="stick"><line x1="188" y1="226" x2="150" y2="104" stroke="#c98b4f" stroke-width="5" stroke-linecap="round"/><circle cx="150" cy="104" r="4" fill="#a96d36"/></g>
        <!-- body -->
        <path d="M44 230 C44 190 70 172 110 172 C150 172 176 190 176 230 Z" fill="#5a2a4a"/>
        <path d="M92 174 L110 206 L128 174 Z" fill="#f6f2ee"/>
        <path d="M92 174 L100 172 L110 206 Z M128 174 L120 172 L110 206 Z" fill="#43203a"/>
        <circle cx="110" cy="204" r="5" fill="#ffd23f" stroke="#12163a" stroke-width="1.5"/>
        <!-- neck + head -->
        <rect x="98" y="150" width="24" height="26" rx="8" fill="#d9a07a"/>
        <ellipse cx="110" cy="116" rx="40" ry="46" fill="#e8b48f"/>
        <!-- hair + bun -->
        <circle cx="110" cy="58" r="17" fill="#7c7c8c"/>
        <path d="M68 112 C62 62 90 62 110 62 C130 62 158 62 152 112 C146 92 134 80 110 80 C86 80 74 92 68 112 Z" fill="#7c7c8c"/>
        <path d="M96 56 C104 52 116 52 124 56" stroke="#5f5f6e" stroke-width="2" fill="none" stroke-linecap="round"/>
        <!-- face -->
        <g class="brows"><path d="M82 100 L102 108" stroke="#3b3b4a" stroke-width="4.5" stroke-linecap="round"/><path d="M138 100 L118 108" stroke="#3b3b4a" stroke-width="4.5" stroke-linecap="round"/></g>
        <g class="eyes"><circle cx="92" cy="118" r="3.6" fill="#12163a"/><circle cx="128" cy="118" r="3.6" fill="#12163a"/></g>
        <g fill="none" stroke="#12163a" stroke-width="3"><rect x="76" y="107" width="32" height="24" rx="8"/><rect x="112" y="107" width="32" height="24" rx="8"/><path d="M108 116 H112"/></g>
        <path d="M76 116 C66 114 64 120 62 138" stroke="#12163a" stroke-width="1.6" fill="none" opacity=".6"/>
        <path d="M110 126 L106 140 H114" stroke="#c98d68" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="mouth-frown" d="M94 156 C102 148 118 148 126 156" stroke="#8a2a3a" stroke-width="4" fill="none" stroke-linecap="round"/>
        <ellipse class="mouth-open" cx="110" cy="154" rx="12" ry="9" fill="#7a1f2e"/>
        <path d="M84 140 l6 2 m-6 4 l7 1 M136 142 l6 -2 m-7 6 l7 -1" stroke="#c98d68" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </figure>
  </header>

  <section class="stage-col" aria-label="Spinner wheel">
    <div class="stage" id="stage">
      <div class="rim" id="rim" aria-hidden="true"></div>
      <canvas id="wheel" role="img" aria-label="Wheel of names"></canvas>
      <div class="pin-wrap" aria-hidden="true"><div class="pin" id="pin"></div></div>
      <button class="hub" id="spin" type="button">Spin</button>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
  </section>

  <aside class="panel" id="panel" aria-label="Names and tally">
    <div class="panel-head">
      <h2>Names<span class="count" id="count">0</span></h2>
      <div class="tools">
        <button class="btn small" id="shuffle" type="button">Shuffle</button>
        <button class="btn small" id="sort" type="button">A–Z</button>
        <button class="btn small" id="reset" type="button">Reset</button>
      </div>
    </div>

    <form class="add" id="add-form" autocomplete="off">
      <label class="sr-only" for="add-input">Add a name</label>
      <input id="add-input" type="text" maxlength="200" placeholder="Add a name, or paste a list" enterkeyhint="done">
      <button class="btn primary" type="submit">Add</button>
    </form>

    <ul class="list" id="list" aria-label="Names on the wheel"></ul>

    <div class="opts">
      <label class="switch" for="opt-remove"><span>Remove each winner after the spin</span><input type="checkbox" id="opt-remove"></label>
      <label class="switch" for="opt-sound"><span>Tick and win sounds</span><input type="checkbox" id="opt-sound" checked></label>
    </div>

    <section id="tally-wrap">
      <div class="history-head">
        <h3>Tally <span class="total" id="total"></span></h3>
        <button class="btn small ghost" id="clear-tally" type="button">Clear counts</button>
      </div>
      <ol class="board" id="board" aria-label="Times each name has been landed on, most first"></ol>
      <p class="note" id="unlanded"></p>
      <div class="history-head recent-head"><h3>Last picks</h3></div>
      <ol class="history" id="history" aria-label="Recent winners, newest first"></ol>
    </section>

    <p class="note">Names and counts are saved in this browser.</p>
  </aside>
</main>

<div class="reveal" id="reveal" role="dialog" aria-modal="true" aria-labelledby="winner-name" hidden>
  <div class="reveal-card">
    <p class="kicker">The wheel picked</p>
    <h2 class="reveal-name" id="winner-name"></h2>
    <p class="reveal-note" id="reveal-note"></p>
    <div class="reveal-actions">
      <button class="btn primary" id="again" type="button">Spin again</button>
      <button class="btn" id="remove-winner" type="button">Remove from wheel</button>
      <button class="btn ghost" id="close-reveal" type="button">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(function () {
  'use strict';
  const TAU = Math.PI * 2;
  const DEFAULTS = ['Sammy', 'Orion', 'Kangmin', 'Edgar', 'Thierry', 'Kelan', 'Yapsa', 'Gabe', 'Quinten', 'Maysamm',
    'Gwen', 'Ian', 'Sawyer', 'Maia', 'Presley', 'Ephie', 'Meadow', 'Lexi', 'Parker', 'Isabelle'];
  const PALETTE = ['#ef476f', '#f78c1f', '#ffd23f', '#8ac926', '#17b1d4', '#3a86ff', '#5b4bdb', '#9b5de5', '#e056c1', '#1fb57a'];
  const KEY = 'the-big-spin-v2';
  const reduceMq = window.matchMedia('(prefers-reduced-motion: reduce)');
  const $ = (id) => document.getElementById(id);

  const stage = $('stage'), rimEl = $('rim'), canvas = $('wheel'), ctx = canvas.getContext('2d'), pin = $('pin'),
    hub = $('spin'), statusEl = $('status'), panel = $('panel'), listEl = $('list'), countEl = $('count'),
    addForm = $('add-form'), addInput = $('add-input'), removeToggle = $('opt-remove'), soundToggle = $('opt-sound'),
    histEl = $('history'), totalEl = $('total'), reveal = $('reveal'), revName = $('winner-name'),
    revNote = $('reveal-note'), btnAgain = $('again'), btnRemove = $('remove-winner'), btnClose = $('close-reveal'),
    toastEl = $('toast'), confettiCv = $('confetti');

  const teacher = $('teacher'), bubble = $('bubble');
  const SPIN_LINES = ['Somebody did not do the reading.', 'Eyes on the wheel.', 'Hmm. Somebody looks unprepared.', 'No talking while it spins.'];
  const IDLE_LINES = ['Sit up straight. Spin the wheel.', 'Late work is not accepted here.', 'I do not repeat myself. Spin.'];
  let idleTimer = 0;
  function say(mood, msg) {
    teacher.dataset.mood = mood;
    bubble.textContent = msg;
    bubble.style.animation = 'none'; void bubble.offsetWidth; bubble.style.animation = '';
  }
  function pick(a) { return a[(Math.random() * a.length) | 0]; }
  function goIdle() { say('idle', names.length ? pick(IDLE_LINES) : 'No names? Detention for everyone.'); }

  let uid = 0;
  const mk = (text, count) => ({ id: 'n' + (++uid), text: text, count: count || 0 });
  let names = DEFAULTS.map((t) => mk(t));
  let opts = { removeWinner: false, sound: true };
  let history = [];
  let theta = 0, spinning = false, raf = 0, introRaf = 0, pendingRemoveId = null, lastTick = 0;
  const fresh = new Set();

  /* ---------- storage ---------- */
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (Array.isArray(d.names)) {
        names = d.names.filter((x) => x && typeof x.t === 'string')
          .map((x) => mk(x.t.slice(0, 32), Math.max(0, parseInt(x.c, 10) || 0)));
      }
      if (typeof d.removeWinner === 'boolean') opts.removeWinner = d.removeWinner;
      if (typeof d.sound === 'boolean') opts.sound = d.sound;
      if (Array.isArray(d.history)) history = d.history.filter((h) => h && typeof h.text === 'string').slice(0, 10);
    } catch (e) { /* storage unavailable: run without it */ }
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        names: names.map((n) => ({ t: n.text, c: n.count })),
        removeWinner: opts.removeWinner, sound: opts.sound, history: history
      }));
    } catch (e) { /* ignore */ }
  }

  /* ---------- colours ---------- */
  function colorFor(i, n) {
    let k = i % PALETTE.length;
    if (i === n - 1 && n > 1 && k === 0) k = 5;
    return PALETTE[k];
  }
  function lum(hex) {
    const c = [1, 3, 5].map((p) => parseInt(hex.slice(p, p + 2), 16) / 255)
      .map((v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)));
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  const inkFor = (hex) => (lum(hex) > 0.28 ? '#12163a' : '#ffffff');

  /* ---------- marquee bulbs ---------- */
  for (let i = 0; i < 28; i++) {
    const b = document.createElement('i');
    b.className = 'bulb';
    b.style.setProperty('--a', (i * 360 / 28) + 'deg');
    rimEl.appendChild(b);
  }

  /* ---------- audio ---------- */
  let audio = null;
  function ensureAudio() {
    if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; } }
    if (audio && audio.state === 'suspended') audio.resume();
  }
  function blip(freq, endFreq, dur, vol, type, delay) {
    if (!opts.sound || !audio) return;
    const t = audio.currentTime + (delay || 0);
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (endFreq !== freq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur * 0.8);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function tick(now) {
    if (now - lastTick < 40) return;
    lastTick = now;
    blip(900, 480, 0.05, 0.1, 'triangle');
    if (pin.animate) pin.animate([{ transform: 'rotate(-24deg)' }, { transform: 'rotate(0deg)' }], { duration: 140, easing: 'ease-out' });
  }
  function winSound() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => blip(f, f, 0.35, 0.12, 'triangle', i * 0.1)); }

  /* ---------- wheel drawing ---------- */
  function drawEmpty(c, r, dpr) {
    ctx.beginPath(); ctx.arc(c, c, r, 0, TAU);
    ctx.fillStyle = 'rgba(120, 130, 210, 0.22)'; ctx.fill();
    ctx.setLineDash([10 * dpr, 8 * dpr]); ctx.lineWidth = 2 * dpr;
    ctx.strokeStyle = getComputedStyle(document.body).color; ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.arc(c, c, r * 0.9, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1; ctx.setLineDash([]);
    ctx.fillStyle = getComputedStyle(document.body).color;
    ctx.font = '700 ' + (r * 0.1) + 'px "Bricolage Grotesque", system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Add some names to spin', c, c + r * 0.34);
  }
  function draw() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const px = Math.max(1, Math.round(canvas.clientWidth * dpr));
    if (canvas.width !== px) { canvas.width = px; canvas.height = px; }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, px, px);
    const c = px / 2, r = c - 2 * dpr, n = names.length;
    if (!n) { drawEmpty(c, r, dpr); return; }
    const seg = TAU / n;
    ctx.save();
    ctx.translate(c, c); ctx.rotate(theta);
    for (let i = 0; i < n; i++) {
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, i * seg, (i + 1) * seg); ctx.closePath();
      ctx.fillStyle = colorFor(i, n); ctx.fill();
    }
    if (n > 1) {
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = Math.max(1, 1.6 * dpr);
      ctx.beginPath();
      for (let i = 0; i < n; i++) { const a = i * seg; ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      ctx.stroke();
    }
    const fam = '"Bricolage Grotesque", system-ui, sans-serif';
    const base = Math.max(Math.min(r * 0.12, r * 0.7 * seg * 0.5), 9 * dpr);
    const maxW = r * 0.64;
    for (let i = 0; i < n; i++) {
      const col = colorFor(i, n);
      ctx.save();
      ctx.rotate((i + 0.5) * seg);
      ctx.fillStyle = inkFor(col); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      let fs = base, label = names[i].text || ' ';
      ctx.font = '700 ' + fs + 'px ' + fam;
      let w = ctx.measureText(label).width;
      while (w > maxW && fs > base * 0.55) { fs *= 0.94; ctx.font = '700 ' + fs + 'px ' + fam; w = ctx.measureText(label).width; }
      if (w > maxW) {
        while (label.length > 1 && ctx.measureText(label + '…').width > maxW) label = label.slice(0, -1);
        label = label.trimEnd() + '…';
      }
      ctx.fillText(label, r * 0.92, fs * 0.04);
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    for (let i = 0; i < n; i++) {
      const a = i * seg;
      ctx.beginPath(); ctx.arc(Math.cos(a) * r * 0.965, Math.sin(a) * r * 0.965, Math.max(2, r * 0.013), 0, TAU); ctx.fill();
    }
    ctx.restore();
    ctx.beginPath(); ctx.arc(c, c, r, 0, TAU);
    ctx.lineWidth = 3 * dpr; ctx.strokeStyle = 'rgba(10,12,40,0.35)'; ctx.stroke();
  }

  /* ---------- tally helpers ---------- */
  function topCount() { return names.reduce((m, n) => Math.max(m, n.count), 0); }
  function totalSpins() { return names.reduce((s, n) => s + n.count, 0); }
  function paintTally(li, n) {
    const t = li.querySelector('.tally');
    const top = topCount();
    t.textContent = n.count;
    t.classList.toggle('has', n.count > 0);
    t.classList.toggle('lead', n.count > 0 && n.count === top);
    t.title = n.text + ' has been landed on ' + n.count + (n.count === 1 ? ' time' : ' times');
  }
  function refreshRows() {
    const n = names.length;
    listEl.querySelectorAll('.row').forEach((li) => {
      const idx = names.findIndex((x) => x.id === li.dataset.id);
      if (idx < 0) return;
      const col = colorFor(idx, n);
      li.style.setProperty('--c', col);
      li.style.setProperty('--c-ink', inkFor(col));
      li.querySelector('input').setAttribute('aria-label', 'Name ' + (idx + 1));
      paintTally(li, names[idx]);
    });
  }

  /* ---------- list ---------- */
  function createRow(n) {
    const li = document.createElement('li');
    li.className = 'row' + (fresh.has(n.id) ? ' enter' : '');
    li.dataset.id = n.id;
    const dot = document.createElement('span'); dot.className = 'dot';
    const input = document.createElement('input');
    input.type = 'text'; input.id = 'name-' + n.id; input.value = n.text; input.maxLength = 32;
    input.autocomplete = 'off'; input.spellcheck = false;
    const tally = document.createElement('span'); tally.className = 'tally'; tally.textContent = n.count;
    const rm = document.createElement('button');
    rm.type = 'button'; rm.className = 'rm';
    rm.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>';
    const syncLabel = () => rm.setAttribute('aria-label', 'Remove ' + (n.text || 'name'));
    syncLabel();
    input.addEventListener('input', () => { n.text = input.value; syncLabel(); draw(); save(); renderBoard(); });
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
    input.addEventListener('blur', () => {
      n.text = n.text.trim(); input.value = n.text;
      if (!n.text) { removeRow(n.id); return; }
      paintTally(li, n); draw(); save();
    });
    rm.addEventListener('click', () => removeRow(n.id));
    li.append(dot, input, tally, rm);
    return li;
  }
  function renderList() {
    listEl.textContent = '';
    names.forEach((n) => listEl.appendChild(createRow(n)));
    fresh.clear();
    refreshRows();
  }
  function removeRow(id) {
    const idx = names.findIndex((n) => n.id === id);
    if (idx < 0) return;
    names.splice(idx, 1);
    const li = listEl.querySelector('[data-id="' + id + '"]');
    if (li) { li.classList.add('leaving'); setTimeout(() => li.remove(), 190); }
    afterChange();
  }
  function afterChange() {
    countEl.textContent = names.length;
    refreshRows(); renderHistory(); updateStatus();
    if (!spinning && teacher.dataset.mood === 'idle') goIdle();
    hub.disabled = spinning || names.length === 0;
    canvas.setAttribute('aria-label', 'Wheel with ' + names.length + ' names');
    draw(); save();
    canvas.classList.remove('bump'); void canvas.offsetWidth; canvas.classList.add('bump');
  }
  function updateStatus(msg) {
    statusEl.textContent = msg || (names.length ? names.length + (names.length === 1 ? ' name' : ' names') + ' on the wheel' : 'Add a few names to get started.');
  }

  function addNames(raw) {
    const parts = raw.split(/[\n,;]+/).map((s) => s.trim().slice(0, 32)).filter(Boolean);
    if (!parts.length) return;
    parts.forEach((t) => { const n = mk(t); names.push(n); fresh.add(n.id); listEl.appendChild(createRow(n)); });
    fresh.clear();
    listEl.scrollTop = listEl.scrollHeight;
    afterChange();
  }

  /* ---------- history ---------- */
  function renderBoard() {
    const board = $('board'), unl = $('unlanded');
    board.textContent = '';
    const landed = names.map((n, i) => ({ n: n, i: i })).filter((x) => x.n.count > 0)
      .sort((a, b) => b.n.count - a.n.count || a.n.text.localeCompare(b.n.text, undefined, { sensitivity: 'base' }));
    const total = totalSpins(), top = landed.length ? landed[0].n.count : 1;
    if (!landed.length) {
      const li = document.createElement('li'); li.className = 'empty';
      li.textContent = 'Nobody has been landed on yet. Spin the wheel and the counts show up here.';
      board.appendChild(li);
    }
    let rank = 0, prev = -1;
    landed.forEach((x, k) => {
      if (x.n.count !== prev) { rank = k + 1; prev = x.n.count; }
      const li = document.createElement('li');
      if (rank === 1) li.className = 'first';
      li.style.setProperty('--c', colorFor(x.i, names.length));
      const r = document.createElement('span'); r.className = 'rank'; r.textContent = rank;
      const who = document.createElement('div'); who.className = 'who';
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = x.n.text;
      const num = document.createElement('span'); num.className = 'num';
      const pct = Math.round(x.n.count / total * 100);
      num.innerHTML = '<b></b> · ' + pct + '%';
      num.firstChild.textContent = x.n.count + '×';
      who.append(nm, num);
      const track = document.createElement('div'); track.className = 'track';
      const fill = document.createElement('div'); fill.className = 'fill';
      track.appendChild(fill);
      li.append(r, who, track); board.appendChild(li);
      requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = (x.n.count / top * 100) + '%'; }));
    });
    const zero = names.filter((n) => n.count === 0 && n.text);
    unl.textContent = landed.length && zero.length
      ? 'Not landed yet (' + zero.length + '): ' + zero.map((n) => n.text).join(', ')
      : (landed.length && !zero.length ? 'Everyone has been landed on at least once.' : '');
  }

  function renderHistory() {
    renderBoard();
    histEl.textContent = '';
    const total = totalSpins();
    totalEl.textContent = total ? '· ' + total + (total === 1 ? ' spin' : ' spins') : '';
    if (!history.length) {
      const li = document.createElement('li');
      li.textContent = 'No spins yet';
      li.style.color = 'var(--muted)';
      histEl.appendChild(li);
      return;
    }
    history.forEach((h) => {
      const li = document.createElement('li');
      li.style.setProperty('--c', h.color);
      const d = document.createElement('span'); d.className = 'dot';
      const t = document.createElement('span'); t.textContent = h.text;
      li.append(d, t); histEl.appendChild(li);
    });
  }

  /* ---------- spinning ---------- */
  const easeOut = (t) => 1 - Math.pow(1 - t, 4);
  function indexAt(th) {
    const n = names.length;
    const a = (((1.5 * Math.PI - th) % TAU) + TAU) % TAU;
    return Math.min(n - 1, Math.floor(a / (TAU / n)));
  }
  function spin() {
    if (spinning || !names.length || !reveal.hidden) return;
    ensureAudio();
    cancelAnimationFrame(introRaf);
    spinning = true;
    stage.classList.add('spinning'); panel.classList.add('locked'); panel.inert = true; hub.disabled = true;
    updateStatus('Spinning…');
    clearTimeout(idleTimer); say('spinning', pick(SPIN_LINES));
    const extra = (5 + Math.random() * 3) * TAU + Math.random() * TAU;
    const dur = reduceMq.matches ? 1400 : 5200 + Math.random() * 1800;
    const t0 = performance.now(), th0 = theta;
    let last = indexAt(theta);
    const step = (now) => {
      const t = Math.min(1, (now - t0) / dur);
      theta = th0 + extra * easeOut(t);
      const idx = indexAt(theta);
      if (idx !== last) { last = idx; tick(now); }
      draw();
      if (t < 1) raf = requestAnimationFrame(step); else finish(idx);
    };
    raf = requestAnimationFrame(step);
  }
  function finish(idx) {
    theta = ((theta % TAU) + TAU) % TAU;
    spinning = false;
    stage.classList.remove('spinning'); panel.classList.remove('locked'); panel.inert = false;
    hub.disabled = names.length === 0;
    const w = names[idx];
    const color = colorFor(idx, names.length);
    w.count += 1;
    history.unshift({ text: w.text, color: color });
    history = history.slice(0, 10);
    pendingRemoveId = opts.removeWinner ? w.id : null;
    refreshRows(); renderHistory(); save();
    const li = listEl.querySelector('[data-id="' + w.id + '"]');
    if (li) {
      li.classList.remove('won'); void li.offsetWidth; li.classList.add('won');
      li.scrollIntoView({ block: 'nearest', behavior: reduceMq.matches ? 'auto' : 'smooth' });
      const tl = li.querySelector('.tally'); tl.classList.remove('pop'); void tl.offsetWidth; tl.classList.add('pop');
    }
    updateStatus(w.text + ' was picked.');
    say('win', w.count >= 3 ? w.text + ' AGAIN? Bold of you.' : w.text + ', to the board. Now.');
    clearTimeout(idleTimer); idleTimer = setTimeout(goIdle, 9000);
    winSound(); burst(); setTimeout(() => openReveal(w, color), reduceMq.matches ? 0 : 500);
  }

  /* ---------- reveal ---------- */
  function openReveal(w, color) {
    revName.textContent = w.text;
    revName.style.setProperty('--c', color);
    revName.style.setProperty('--c-ink', inkFor(color));
    const times = w.count === 1 ? 'for the first time' : 'for the ' + ordinal(w.count) + ' time';
    revNote.textContent = w.text + ' has landed ' + times + '.' + (pendingRemoveId ? ' Comes off the wheel when you close this.' : '');
    btnRemove.hidden = !!pendingRemoveId;
    reveal.hidden = false;
    btnAgain.focus();
  }
  function ordinal(n) {
    const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }
  function closeReveal() {
    if (reveal.hidden) return;
    reveal.hidden = true;
    if (pendingRemoveId) { const id = pendingRemoveId; pendingRemoveId = null; removeRow(id); }
    if (!hub.disabled) hub.focus({ preventScroll: true });
  }
  btnClose.addEventListener('click', closeReveal);
  btnAgain.addEventListener('click', () => { closeReveal(); setTimeout(spin, 80); });
  btnRemove.addEventListener('click', () => {
    const name = revName.textContent;
    const target = names.find((n) => n.text === name);
    pendingRemoveId = null;
    reveal.hidden = true;
    if (target) removeRow(target.id);
  });
  reveal.addEventListener('mousedown', (e) => { if (e.target === reveal) closeReveal(); });
  reveal.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab') return;
    const f = [btnAgain, btnRemove, btnClose].filter((b) => !b.hidden);
    const i = f.indexOf(document.activeElement);
    e.preventDefault();
    f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
  });

  /* ---------- confetti ---------- */
  let parts = [], cRaf = 0;
  function burst() {
    if (reduceMq.matches) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    confettiCv.width = window.innerWidth * dpr; confettiCv.height = window.innerHeight * dpr;
    const rect = stage.getBoundingClientRect();
    const ox = (rect.left + rect.width / 2) * dpr, oy = (rect.top + rect.height / 2) * dpr;
    for (let i = 0; i < 170; i++) {
      const a = Math.random() * TAU, s = (4 + Math.random() * 13) * dpr;
      parts.push({
        x: ox, y: oy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 5 * dpr,
        w: (6 + Math.random() * 7) * dpr, h: (4 + Math.random() * 5) * dpr,
        rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 0.4,
        color: PALETTE[(Math.random() * PALETTE.length) | 0], age: 0, max: 130 + Math.random() * 90, g: 0.28 * dpr
      });
    }
    cancelAnimationFrame(cRaf);
    const cc = confettiCv.getContext('2d');
    const loop = () => {
      cc.clearRect(0, 0, confettiCv.width, confettiCv.height);
      parts = parts.filter((p) => p.age < p.max);
      parts.forEach((p) => {
        p.age++; p.vy += p.g; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        cc.save(); cc.translate(p.x, p.y); cc.rotate(p.rot);
        cc.globalAlpha = Math.min(1, (p.max - p.age) / 40);
        cc.fillStyle = p.color; cc.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cc.restore();
      });
      if (parts.length) cRaf = requestAnimationFrame(loop); else cc.clearRect(0, 0, confettiCv.width, confettiCv.height);
    };
    loop();
  }

  /* ---------- toast ---------- */
  let toastT = 0;
  function hideToast() { toastEl.hidden = true; }
  function toast(msg, label, action) {
    toastEl.textContent = '';
    const s = document.createElement('span'); s.textContent = msg; toastEl.appendChild(s);
    if (action) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'toast-btn'; b.textContent = label;
      b.addEventListener('click', () => { action(); hideToast(); });
      toastEl.appendChild(b);
    }
    toastEl.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(hideToast, 6000);
  }

  /* ---------- controls ---------- */
  hub.addEventListener('click', spin);
  canvas.addEventListener('click', spin);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeReveal(); return; }
    if (e.code === 'Space' && !e.repeat) {
      const t = e.target;
      if (t && t.closest && t.closest('input, button, textarea, a, select')) return;
      if (!reveal.hidden) return;
      e.preventDefault(); spin();
    }
  });
  addForm.addEventListener('submit', (e) => { e.preventDefault(); addNames(addInput.value); addInput.value = ''; addInput.focus(); });
  removeToggle.addEventListener('change', () => { opts.removeWinner = removeToggle.checked; save(); });
  soundToggle.addEventListener('change', () => { opts.sound = soundToggle.checked; if (opts.sound) ensureAudio(); save(); });

  $('shuffle').addEventListener('click', () => {
    for (let i = names.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = names[i]; names[i] = names[j]; names[j] = t; }
    renderList(); afterChange();
  });
  $('sort').addEventListener('click', () => {
    names.sort((a, b) => a.text.localeCompare(b.text, undefined, { sensitivity: 'base' }));
    renderList(); afterChange();
  });
  $('reset').addEventListener('click', () => {
    const prev = names.map((n) => ({ t: n.text, c: n.count })), prevHistory = history.slice();
    names = DEFAULTS.map((t) => mk(t)); history = [];
    renderList(); afterChange();
    toast('Back to the original ' + names.length + ' names, counts cleared.', 'Undo', () => {
      names = prev.map((x) => mk(x.t, x.c)); history = prevHistory;
      renderList(); afterChange();
    });
  });
  $('clear-tally').addEventListener('click', () => {
    if (!totalSpins() && !history.length) return;
    const prev = names.map((n) => n.count), prevHistory = history.slice();
    names.forEach((n) => { n.count = 0; }); history = [];
    afterChange();
    toast('Counts cleared.', 'Undo', () => {
      names.forEach((n, i) => { n.count = prev[i] || 0; }); history = prevHistory; afterChange();
    });
  });

  /* ---------- boot ---------- */
  load();
  removeToggle.checked = opts.removeWinner; soundToggle.checked = opts.sound;
  renderList(); countEl.textContent = names.length; renderHistory(); updateStatus();
  hub.disabled = names.length === 0;
  canvas.setAttribute('aria-label', 'Wheel with ' + names.length + ' names');
  draw();
  if (window.ResizeObserver) new ResizeObserver(draw).observe(stage); else window.addEventListener('resize', draw);
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
  if (document.fonts) { document.fonts.load('700 20px "Bricolage Grotesque"').then(draw).catch(function () {}); document.fonts.ready.then(draw); }

  if (!reduceMq.matches && names.length) {
    const t0 = performance.now(), from = -TAU * 0.75;
    const intro = (now) => {
      const t = Math.min(1, (now - t0) / 1300);
      theta = from * (1 - (1 - Math.pow(1 - t, 3)));
      draw();
      if (t < 1) introRaf = requestAnimationFrame(intro); else theta = 0;
    };
    introRaf = requestAnimationFrame(intro);
  }
})();
</script>

</body>
